# Wiki.js configuration for Railway. $(VAR) values come from service variables.
port: $(PORT:3000)
bindIP: 0.0.0.0
db:
  type: postgres
  host: '$(DB_HOST)'
  port: $(DB_PORT)
  user: '$(DB_USER)'
  pass: '$(DB_PASS)'
  db: $(DB_NAME)
  ssl: false
ssl:
  enabled: false
pool:
  min: 1
  max: 10
logLevel: $(LOG_LEVEL:info)
logFormat: default
offline: false
ha: false
dataPath: ./data
bodyParserLimit: 5mb
